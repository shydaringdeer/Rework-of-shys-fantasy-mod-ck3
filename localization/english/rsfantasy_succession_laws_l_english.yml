l_english:
 # SFantasy realm succession laws (show in list when you have matching government)
 rsfantasy_elvish_eldest_succession_law:0 "Elvish Eldest"
 rsfantasy_elvish_eldest_succession_law_subname:0 "Oldest Child Inherits"
 rsfantasy_elvish_eldest_succession_law_effects:0 "\n#V Under $rsfantasy_elvish_eldest_succession_law$ [succession], your oldest child inherits all your [titles].\n\n#weak Granted when adopting High Elvish Feudalism. The eldest of the line inherits, as is the elvish tradition.#!"

 rsfantasy_dwarven_lineage_succession_law:0 "Dwarven Lineage"
 rsfantasy_dwarven_lineage_succession_law_subname:0 "Oldest Child Inherits"
 rsfantasy_dwarven_lineage_succession_law_effects:0 "\n#V Under $rsfantasy_dwarven_lineage_succession_law$ [succession], your oldest child inherits all your [titles].\n\n#weak Granted when adopting Dwarven Hold. Dwarves value lineage; the eldest of your line inherits.#!"

 # SFantasy title succession laws (show in list when you have matching government)
 rsfantasy_orcish_prowess_elective_succession_law:0 "Orcish Prowess Elective"
 rsfantasy_orcish_prowess_elective_succession_law_subname:0 "Strongest Inherits"
 rsfantasy_orcish_prowess_elective_succession_law_effects:0 "\n#V Under $rsfantasy_orcish_prowess_elective_succession_law$, the [ruler|E] and [vassals|E] nominate a [title_heir|E].\n\n#weak Granted when adopting Orcish Warband. Orcs value strength; voters favor candidates with high [prowess|E]. Uses the same election rules as Feudal Elective. Ensure your chosen heir is of your [dynasty|E] or the game will end on succession.#!"

 rsfantasy_goblin_trickery_elective_succession_law:0 "Goblin Trickery Elective"
 rsfantasy_goblin_trickery_elective_succession_law_subname:0 "Schemer's Choice"
 rsfantasy_goblin_trickery_elective_succession_law_effects:0 "\n#V Under $rsfantasy_goblin_trickery_elective_succession_law$, the [ruler|E] and [vassals|E] nominate a [title_heir|E].\n\n#weak Granted when adopting Goblin Warren. Goblins favor the cunning; schemes and intrigue sway the vote. Uses the same election rules as Feudal Elective. Ensure your chosen heir is of your [dynasty|E] or the game will end on succession.#!"

l_english:
	adopt_high_elvish_feudalism_decision:0 "Adopt High Elvish Feudalism"
	adopt_high_elvish_feudalism_decision_desc:0 "Establish the ways of the elder folk as the foundation of your realm. Elves and Dark Elves who hold any [title|E] may adopt this government. You must have [feudal|E] or [clan|E] government. Change [succession|E] laws from the realm [succession|E] tab."
	adopt_high_elvish_feudalism_decision_confirm:0 "Embrace the Elder Ways"
	adopt_high_elvish_feudalism_decision_tooltip:0 "Establish High Elvish Feudalism as your realm's government. Requires at least one county and feudal or clan government."

	adopt_orcish_warband_decision:0 "Adopt Orcish Warband"
	adopt_orcish_warband_decision_desc:0 "Forge your realm into a warband. Only Orcs or Uruk-Hai who rule a [kingdom|E] or above may adopt this government. You must have [feudal|E] or [clan|E] government. Change [succession|E] laws from the realm [succession|E] tab."
	adopt_orcish_warband_decision_confirm:0 "Form the Warband"
	adopt_orcish_warband_decision_tooltip:0 "Establish Orcish Warband government. Requires kingdom tier and feudal or clan government."

	adopt_dwarven_hold_decision:0 "Adopt Dwarven Hold"
	adopt_dwarven_hold_decision_desc:0 "Establish your realm as a dwarven hold. Dwarves who hold any [title|E] may adopt this government. You must have [feudal|E] or [clan|E] government. Change [succession|E] laws from the realm [succession|E] tab."
	adopt_dwarven_hold_decision_confirm:0 "Found the Hold"
	adopt_dwarven_hold_decision_tooltip:0 "Establish Dwarven Hold government. Requires at least one county and feudal or clan government."


	adopt_goblin_warren_decision_desc:0 "Turn your realm into a goblin warren. Only Goblins who rule a [kingdom|E] or above may adopt this government. You must have [feudal|E] or [clan|E] government. Change [succession|E] laws from the realm [succession|E] tab."

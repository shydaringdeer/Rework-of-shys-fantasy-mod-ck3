l_english:
	genetic_desc:0 "This Trait is [congenital|E]"
	trait_rsfantasy_elf:0 "Elf"
	trait_rsfantasy_elf_desc:0 "The Star-Bound. Beings of silver-pulse and terrifying stillness, their minds are vast repositories of eras long forgotten. They experience time as a shallow stream, granting them an alien patience and a natural mastery over the arts of governance and ancient lore."
	trait_rsfantasy_orc:0 "Orc"
	trait_rsfantasy_orc_desc:0 "The Iron-Blooded. Forged for the friction of war, these are creatures of dense obsidian muscle and tireless spirit. Though their lives burn short and bright, they possess a relentless drive to dominate the soil, viewing the world through the cold lens of martial supremacy."
	trait_rsfantasy_dwarf:0 "Dwarf"
	trait_rsfantasy_dwarf_desc:0 "The Deep-Rooted. Stout as the bedrock and carrying the scent of flint and ozone, their souls are tethered to the wealth of the earth. They are the ultimate stewards of tradition and stone, possessing an unyielding resilience and a natural brilliance for the logistics of empire."
	trait_rsfantasy_goblin:0 "Goblin"
	trait_rsfantasy_goblin_desc:0 "The Hollow-Kin. Scrappy, liquid-like survivors who thrive in the shadows of greater empires. Possessing a frantic, scavenger's brilliance, they turn every disadvantage into a weapon, using a twitching, razor-sharp wit to navigate a world that views them with loathing."
	trait_rsfantasy_dark_elf:0 "Dark Elf"
	trait_rsfantasy_dark_elf_desc:0 "The Twilight-Exiled. Those who traded the light of the stars for the secrets of the abyss. They possess a haunting, predatory elegance; masters of the unseen world, they move through the halls of power with a chill grace and a heart hardened by ancient betrayals."
	trait_rsfantasy_uruk_hai:0 "Uruk-Hai"
	trait_rsfantasy_uruk_hai_desc:0 "The Gray Host. Bred for war under a cold hand, they are larger and more disciplined than common orcs—gray-skinned soldiers who endure the sun and march in lockstep. Fierce, tireless, and loyal to the master who forged them."
	trait_group_rsfantasy_elf_group:0 "Fantasy Heritage"
	trait_rsfantasy_elf_group:0 "Fantasy Heritage"

	trait_rsfantasy_summoned_warrior:0 "Summoned Warrior"
	trait_rsfantasy_summoned_warrior_desc:0 "This character was summoned to court as a warrior and bears the mark of battle."
	trait_rsfantasy_summoned_scholar:0 "Summoned Scholar"
	trait_rsfantasy_summoned_scholar_desc:0 "This character was summoned to court as a scholar, versed in lore and cunning."
